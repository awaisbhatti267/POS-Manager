services:
  # ── Backend (Express) ──────────────────────────────────────────
  - type: web
    name: inventory-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false   # set manually in Render dashboard
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

  # ── Frontend (React/Vite) ──────────────────────────────────────
  - type: web
    name: inventory-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set manually: your Render backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
